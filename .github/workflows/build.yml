name: Build Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build raidlords-bot (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: raidlords-bot-linux-x86_64
            binary: target/release/raidlords-bot
            target: ""

          - os: windows-latest
            artifact: raidlords-bot-windows-x86_64
            binary: target/release/raidlords-bot.exe
            target: ""

          - os: macos-latest
            artifact: raidlords-bot-macos-aarch64
            binary: target/release/raidlords-bot
            target: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Run tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --locked

      - name: Build release
        run: cargo build --release --locked ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary }}
